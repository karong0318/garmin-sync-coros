name: coros-sync-garmin

on:
  workflow_dispatch:
  schedule:
    # UTC: 08:17, 15:17, and 04:17 in mainland China.
    - cron: '17 0,7,20 * * *'

permissions:
  contents: read

concurrency:
  group: coros-sync-garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Check account secrets
        shell: bash
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
        run: |
          missing=0
          for name in COROS_EMAIL COROS_PASSWORD GARMIN_EMAIL GARMIN_PASSWORD GARMIN_AUTH_DOMAIN; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing Actions secret: ${name}"
              missing=1
            fi
          done
          if (( missing )); then exit 1; fi
          if [[ "$GARMIN_AUTH_DOMAIN" != "CN" && "$GARMIN_AUTH_DOMAIN" != "COM" ]]; then
            echo "::error::GARMIN_AUTH_DOMAIN must be CN or COM"
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync COROS activities to Garmin
        env:
          COROS_EMAIL: ${{ secrets.COROS_EMAIL }}
          COROS_PASSWORD: ${{ secrets.COROS_PASSWORD }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_AUTH_DOMAIN: ${{ secrets.GARMIN_AUTH_DOMAIN }}
        run: python scripts/coros/coros_sync_garmin.py
